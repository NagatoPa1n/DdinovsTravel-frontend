server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Compress text/JS/CSS/JSON over the (distant, possibly slow) link. Cuts the
    # JS bundles ~3x (e.g. charts 358KB -> ~107KB) and shrinks API JSON payloads —
    # the biggest easy win when users are far from the server on the open internet.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript text/javascript application/json image/svg+xml application/xml font/woff2;

    # API → backend
    #location /api/ {
    #    proxy_pass         http://:3032/api/;
    #    proxy_http_version 1.1;
    #    proxy_set_header   Host              $host;
    #    proxy_set_header   X-Real-IP         $remote_addr;
    #    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    #}

    # Hashed build assets — cache hard, but a MISSING chunk must return 404, NOT
    # fall back to the SPA index.html. Otherwise the browser receives HTML for a
    # .js request and throws "'text/html' is not a valid JavaScript MIME type"
    # (happens to a tab left open across a redeploy: the old chunk hash is gone).
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # App shell. Never cache index.html so a fresh deploy's new asset hashes are
    # picked up on the next load — this is what prevents the stale-chunk error.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
